<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Pengelola — Kopi Calon Sarjana</title>
  <link rel="stylesheet" href="CSS/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #faf6f1 0%, #f0e6dc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      font-family: var(--font-main, sans-serif);
      color: var(--color-text, #2d2016);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface, #ffffff);
      border: 1px solid var(--color-border, #e8ddd2);
      border-radius: var(--radius-lg, 16px);
      box-shadow: 0 10px 30px rgba(92, 61, 46, 0.12);
      padding: 2.25rem 2rem;
      box-sizing: border-box;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary, #5c3d2e) 0%, var(--color-accent, #c7956d) 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem auto;
      box-shadow: 0 6px 16px rgba(92, 61, 46, 0.2);
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--color-primary, #5c3d2e);
      margin-bottom: 0.35rem;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--color-text-secondary, #7a6b5d);
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text, #2d2016);
      margin-bottom: 0.45rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      padding-right: 2.5rem;
      border: 1.5px solid var(--color-border, #e8ddd2);
      border-radius: var(--radius-md, 10px);
      font-size: 0.95rem;
      color: var(--color-text, #2d2016);
      background: #faf8f5;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .input-field:focus {
      background: #ffffff;
      border-color: var(--color-accent, #c7956d);
      box-shadow: 0 0 0 3px rgba(199, 149, 109, 0.2);
    }

    .input-field.input-error {
      border-color: var(--color-error, #c0392b);
      background: #fff8f8;
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--color-text-secondary, #7a6b5d);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .field-error-msg {
      font-size: 0.8rem;
      color: var(--color-error, #c0392b);
      margin-top: 0.35rem;
      min-height: 1.1rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .global-error-box {
      background: var(--color-error-bg, #fdecea);
      border: 1px solid rgba(192, 57, 43, 0.3);
      color: var(--color-error, #c0392b);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md, 10px);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .global-error-box.hidden {
      display: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--color-primary, #5c3d2e);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md, 10px);
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(92, 61, 46, 0.25);
    }

    .btn-submit:hover {
      background: var(--color-primary-light, #7a5640);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(92, 61, 46, 0.3);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .demo-hint-card {
      margin-top: 1.75rem;
      padding: 1rem;
      background: #f7f1e9;
      border: 1px dashed var(--color-accent, #c7956d);
      border-radius: var(--radius-md, 10px);
      font-size: 0.8rem;
      color: var(--color-text, #2d2016);
    }

    .demo-hint-card strong {
      display: block;
      color: var(--color-primary, #5c3d2e);
      margin-bottom: 0.35rem;
    }

    .demo-account-item {
      display: flex;
      justify-content: space-between;
      margin-top: 0.25rem;
      padding: 0.2rem 0;
      cursor: pointer;
      border-radius: 4px;
    }

    .demo-account-item:hover {
      background: rgba(92, 61, 46, 0.06);
    }

    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--color-text-secondary, #7a6b5d);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-home-link:hover {
      color: var(--color-primary, #5c3d2e);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <div class="login-header">
      <div class="brand-logo-circle">☕</div>
      <h1 class="brand-title">Kopi Calon Sarjana</h1>
      <p class="brand-subtitle">Portal Masuk Dasbor Pengelola</p>
    </div>

    <!-- Container Pesan Error Global (Kredensial Salah) -->
    <div id="pesan-error-login" class="global-error-box hidden" role="alert">
      <span>⚠️</span>
      <span id="pesan-error-login-text">Username atau password salah</span>
    </div>

    <form id="form-login" novalidate onsubmit="handleFormLogin(event)">
      <!-- Field Username -->
      <div class="form-group">
        <label for="input-username" class="form-label">Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="input-username"
            name="username"
            class="input-field"
            placeholder="Masukkan username (6-15 karakter)"
            autocomplete="username"
            required
          >
        </div>
        <div id="error-username" class="field-error-msg" aria-live="polite"></div>
      </div>

      <!-- Field Password -->
      <div class="form-group">
        <label for="input-password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="input-password"
            name="password"
            class="input-field"
            placeholder="Masukkan password (8-20 karakter)"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            onclick="togglePasswordVisibility()"
            title="Tampilkan / Sembunyikan Password"
            aria-label="Tampilkan / Sembunyikan Password"
          >
            <span id="icon-eye">👁️</span>
          </button>
        </div>
        <div id="error-password" class="field-error-msg" aria-live="polite"></div>
      </div>

      <!-- Tombol Masuk -->
      <button type="submit" id="btn-login" class="btn-submit">
        <span>Masuk ke Sistem</span>
        <span>→</span>
      </button>
    </form>

    <!-- Kartu Referensi Kredensial untuk Pengujian Cepat -->
    <div class="demo-hint-card">
      <strong>Kredensial Pengujian (Klik untuk autofill):</strong>
      <div class="demo-account-item" onclick="isiKredensial('admin01', 'Kopi12345')">
        <span>👑 Admin: <code>admin01</code></span>
        <span><code>Kopi12345</code></span>
      </div>
      <div class="demo-account-item" onclick="isiKredensial('kasir01', 'Kasir12345')">
        <span>💼 Kasir: <code>kasir01</code></span>
        <span><code>Kasir12345</code></span>
      </div>
    </div>

    <a href="beranda.html" class="back-home-link">← Kembali ke Halaman Pelanggan</a>
  </main>

  <!-- Script Dependensi -->
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Guard Sesi: Jika sudah login, langsung arahkan ke dasbor terkait
    document.addEventListener("DOMContentLoaded", () => {
      guardHalamanLogin();
    });

    // Toggle tampilan teks password
    function togglePasswordVisibility() {
      const pwd = document.getElementById("input-password");
      const icon = document.getElementById("icon-eye");
      if (!pwd) return;
      if (pwd.type === "password") {
        pwd.type = "text";
        if (icon) icon.textContent = "🙈";
      } else {
        pwd.type = "password";
        if (icon) icon.textContent = "👁️";
      }
    }

    // Autofill cepat untuk memudahkan pengujian manual
    function isiKredensial(u, p) {
      const userField = document.getElementById("input-username");
      const pwdField = document.getElementById("input-password");
      if (userField) userField.value = u;
      if (pwdField) pwdField.value = p;
      resetError();
    }

    function resetError() {
      const errGlobal = document.getElementById("pesan-error-login");
      const errGlobalText = document.getElementById("pesan-error-login-text");
      const errUser = document.getElementById("error-username");
      const errPwd = document.getElementById("error-password");
      const inputUser = document.getElementById("input-username");
      const inputPwd = document.getElementById("input-password");

      if (errGlobal) errGlobal.classList.add("hidden");
      if (errGlobalText) errGlobalText.textContent = "";
      if (errUser) errUser.textContent = "";
      if (errPwd) errPwd.textContent = "";
      if (inputUser) inputUser.classList.remove("input-error");
      if (inputPwd) inputPwd.classList.remove("input-error");
    }

    // Handler form login
    function handleFormLogin(event) {
      if (event) event.preventDefault();
      resetError();

      const userField = document.getElementById("input-username");
      const pwdField = document.getElementById("input-password");
      const errGlobal = document.getElementById("pesan-error-login");
      const errGlobalText = document.getElementById("pesan-error-login-text");
      const errUser = document.getElementById("error-username");
      const errPwd = document.getElementById("error-password");

      const username = userField ? userField.value : "";
      const password = pwdField ? pwdField.value : "";

      // Jalankan fungsi autentikasi terpusat dari js/auth.js
      const hasil = login(username, password);

      if (!hasil.success) {
        if (hasil.field === "username") {
          // TC-19: Username di luar 6-15 karakter
          if (errUser) errUser.textContent = hasil.error;
          if (userField) {
            userField.classList.add("input-error");
            userField.focus();
          }
        } else if (hasil.field === "password") {
          // Password di luar 8-20 karakter
          if (errPwd) errPwd.textContent = hasil.error;
          if (pwdField) {
            pwdField.classList.add("input-error");
            pwdField.focus();
          }
        } else {
          // TC-05: Kredensial tidak cocok (Format valid tapi salah akun/password)
          if (errGlobal) {
            errGlobal.classList.remove("hidden");
            if (errGlobalText) errGlobalText.textContent = hasil.error;
            else errGlobal.textContent = hasil.error;
          }
        }
        return false;
      }

      // Berhasil login (TC-04)
      window.location.href = hasil.redirect;
      return true;
    }
  </script>
</body>
</html>
